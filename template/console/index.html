<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>どこでもデスク｜自分たちで育てるAI仕事場</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">机</span><div><strong>どこでもデスク</strong><small>DOKODEMO DESK</small></div></div>
    <div id="organization" class="organization">仕事場を読み込み中</div>
    <nav aria-label="画面を選ぶ">
      <a href="#overview" data-view="overview"><span aria-hidden="true">01</span>担当とつながり</a>
      <a href="#works" data-view="works"><span aria-hidden="true">02</span>仕事と成果</a>
      <a href="#reports" data-view="reports"><span aria-hidden="true">03</span>日報・記録</a>
      <a href="#boards" data-view="boards"><span aria-hidden="true">04</span>共有板</a>
      <a href="#guide" data-view="guide"><span aria-hidden="true">05</span>育て方のガイド</a>
    </nav>
    <div class="sidebar-foot"><span class="dot"></span>この端末で読む仕事場<p>自分たちで育てる<br>AI仕事場。</p><small>v0.2 · 読み取り専用</small></div>
  </aside>
  <div class="workspace">
    <header><div><span id="mode" class="mode">読み込み中</span><span id="updated"></span></div><button id="refresh" class="button">記録を更新 <span aria-hidden="true">↻</span></button></header>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    <main id="main" tabindex="-1"><p class="empty">原本を読んでいます…</p></main>
    <footer>仕事の状態は担当が記した内容です。画面を開くか「記録を更新」で原本を読み直します。</footer>
  </div>
  <dialog id="document-dialog" aria-labelledby="document-title"><div class="dialog-bar"><strong id="document-title">原本を読む</strong><button id="doc-close" class="button" aria-label="原本を閉じる">閉じる ×</button></div><div id="document-body"></div></dialog>
  <script src="/app.js"></script>
</body>
</html>
